name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements.txt
          python -m pip check

      - name: Validate rule sets
        run: python scripts/validate_rules.py --path rules

      - name: Merge rule sets
        run: python scripts/merge_rules.py --path rules --output output

      - name: Check build outputs
        run: |
          test -s output/Rule.json
          test -s output/Auto.json
          python -m json.tool output/Rule.json > /dev/null
          python -m json.tool output/Auto.json > /dev/null

      - name: Upload rule files
        uses: actions/upload-artifact@v7
        with:
          name: Huorong-ATP-Rules
          path: |
            output/Rule.json
            output/Auto.json
          if-no-files-found: error
